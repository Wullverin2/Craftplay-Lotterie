      enabled: true
      java-item: "stats-gui.items.most-played"
    most-tickets:
      enabled: true
      java-item: "stats-gui.items.most-tickets"
    most-spent:
      enabled: true
      java-item: "stats-gui.items.most-spent"
    most-wins:
      enabled: true
      java-item: "stats-gui.items.most-wins"
    highest-win:
      enabled: true
      java-item: "stats-gui.items.highest-win"
    total-won:
      enabled: true
      java-item: "stats-gui.items.total-won"
    current-tickets:
      enabled: true
      java-item: "stats-gui.items.current-tickets"
    last-winners:
      enabled: true
      java-item: "stats-gui.items.last-winners"
    back:
      enabled: true
      java-item: "stats-gui.items.back"

personal-stats-gui:
  enabled: true
  title: "&6&lDeine Lotterie Statistik"
  content:
    - "&7Deine Tickets: &f%tickets%"
    - "&7Deine Chance: &f%chance%"
    - "&7Aktueller Topf: &f%pot%"
  items:
    overview:
      enabled: true
      java-item: "personal-stats-gui.items.overview"
    buy:
      enabled: true
      java-item: "personal-stats-gui.items.buy"
    back:
      enabled: true
      java-item: "personal-stats-gui.items.back"
    close:
      enabled: true
      java-item: "personal-stats-gui.items.close"

language-gui:
  enabled: true
  title: "&6&lSprache"
  content:
    - "&7Waehle deine Sprache."
  auto-detect:
    enabled: true
    button-name: "&a%language_name%"
    button-lore:
      - "&7Code: &f%language%"
      - "&7Status: &f%selected%"
  items:
    back:
      enabled: true
      java-item: "language-gui.items.back"

winner-wall-gui:
  enabled: true
  title: "&6&lGewinnerwand"
  content:
    - "&7Letzte Gewinner:"
    - "%bedrock_last_winners%"
  items:
    back:
      enabled: true
      name: "&aZurueck"
      lore:
        - "&7Zurueck zur Statistik."
      actions:
        - "open-stats"

profile-gui:
  enabled: true
  title: "&6&lLotterie auswaehlen"
  content:
    - "&7Waehle dein Lotterie-Profil."
  dynamic-profiles:
    enabled: true
    button-name: "%selected_color%%profile_name%"
    button-lore:
      - "&7ID: &f%profile_id%"
      - "&7Topf: &f%profile_pot%"
      - "&7Tickets: &f%profile_tickets%"
      - "%selected_text%"
  items:
    back:
      enabled: true
      name: "&aZurueck"
      lore:
        - "&7Zurueck zur Lotterie."
      actions:
        - "open-main"

