# Craftplay Lotterie - Bedrock-GUI / Bedrock GUI
# DE: Diese Datei steuert die Floodgate/Cumulus-Formulare fuer Bedrock-Spieler.
# EN: This file controls the Floodgate/Cumulus forms for Bedrock players.
# DE: java-item verweist auf einen Button aus gui.yml. Name, Lore, Permission und Aktionen koennen dadurch uebernommen werden.
# EN: java-item points to a button from gui.yml. Name, lore, permission and actions can be inherited from it.
# DE: Eigene Bedrock-Buttons koennen name, lore, actions und optional image.type/image.data nutzen.
# EN: Custom Bedrock buttons can use name, lore, actions and optional image.type/image.data.

bedrock:
  # DE: Aktiviert Bedrock-Formulare fuer Floodgate-Spieler. Java-Spieler nutzen weiterhin das normale Inventar-GUI.
  # EN: Enables Bedrock forms for Floodgate players. Java players still use the normal inventory GUI.
  enabled: true
  # DE: Wenn true, wird Bedrock-Spielern beim Join automatisch das Formular geoeffnet.
  # EN: When true, Bedrock players automatically see the form on join.
  open-on-join: false
  # DE: Anzahl Lore-Zeilen, die unter dem Buttonnamen angezeigt werden.
  # EN: Number of lore lines shown below the button name.
  button-lore-lines: 1
  # DE: Format eines Buttons. Platzhalter: %name%, %lore%.
  # EN: Button format. Placeholders: %name%, %lore%.
  button-format: "%name%\n%lore%"

gui:
  enabled: true
  title: "&6&lCraftplay Lotterie"
  content:
    - "&7Topf: &f%pot%"
    - "&7Tickets: &f%tickets_total%"
    - "&7Teilnehmer: &f%players%/%min_players%"
    - "&7Nächste Ziehung: &f%next_draw%"
  items:
    buy-small:
      enabled: true
      java-item: "gui.items.buy-small"
    statistics:
      enabled: true
      java-item: "gui.items.statistics"
    personal-statistics:
      enabled: true
      java-item: "gui.items.personal-statistics"
    language:
      enabled: true
      java-item: "gui.items.language"
    album:
      enabled: false
      java-item: "gui.items.album"
    claims:
      enabled: false
      java-item: "gui.items.claims"
    lucky-number:
      enabled: false
      java-item: "gui.items.lucky-number"
    watch-draw:
      enabled: false
      java-item: "gui.items.watch-draw"
    profiles:
      enabled: false
      java-item: "gui.items.profiles"
    season-shop:
      enabled: false
      java-item: "gui.items.season-shop"
    free-ticket:
      enabled: false
      java-item: "gui.items.free-ticket"
    admin:
      enabled: true
      java-item: "gui.items.admin"
    close:
      enabled: true
      java-item: "gui.items.close"

stats-gui:
  enabled: true
  title: "&6&lLotterie Statistik"
