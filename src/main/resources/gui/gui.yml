# Craftplay Lotterie - GUI-Konfiguration / GUI configuration
# DE: Diese Datei steuert alle Inventar-Menüs. Texte unterstützen Farbcodes (&) und PlaceholderAPI-Platzhalter.
# EN: This file controls all inventory menus. Texts support color codes (&) and PlaceholderAPI placeholders.
# DE: Gemeinsame Item-Einstellungen:
# DE: enabled = Button anzeigen/ausblenden, slot = einzelner Platz, slots = mehrere Plätze/Ranges, material = Bukkit-Material, head-database-id = HeadDatabase-Kopf,
# DE: skull-owner = Spielername für Player-Heads, name/lore = Anzeige, buy-amount = Ticketmenge am Kaufbutton,
# DE: refresh-after-click = GUI nach Klick aktualisieren, actions = Klickaktionen.
# EN: Shared item settings:
# EN: enabled = show/hide button, slot = one slot, slots = multiple slots/ranges, material = Bukkit material, head-database-id = HeadDatabase head,
# EN: skull-owner = player name for player heads, name/lore = display, buy-amount = ticket amount on buy buttons,
# EN: refresh-after-click = refresh GUI after click, actions = click actions.
# DE: Aktionen: buy:<anzahl>, close, open-stats, open-personal-stats, open-album, open-claims,
# DE: watch-draw, open-language, open-admin, open-main, open-profile, force-draw, reload-plugin,
# DE: reset-round, language:<code>, player-command:<befehl>, console-command:<befehl>, message:<text>.
# EN: Actions: buy:<amount>, close, open-stats, open-personal-stats, open-album, open-claims,
# EN: watch-draw, open-language, open-admin, open-main, open-profile, force-draw, reload-plugin,
# EN: reset-round, language:<code>, player-command:<command>, console-command:<command>, message:<text>.

gui:
  # DE: Aktiviert das Hauptmenü. EN: Enables the main menu.
  enabled: true
  # DE: Titel des Hauptmenüs. EN: Title of the main menu.
  title: "&6&lCraftplay Lotterie"
  # DE: Inventargröße, muss ein Vielfaches von 9 sein. EN: Inventory size, must be a multiple of 9.
  size: 45
  # DE: Standard-Füllmaterial für leere Slots. EN: Default filler material for empty slots.
  filler-material: "BLACK_STAINED_GLASS_PANE"
  # DE: Alle Buttons/Dekoitems des Hauptmenüs. EN: All buttons/decorative items in the main menu.
  items:
    top-decoration:
      enabled: true
      slots: ["0-8", 27, 28, 29, 30, 32, 33]
      material: "YELLOW_STAINED_GLASS_PANE"
      name: "&6"
      lore: []
    buy-small:
      enabled: true
      slot: 10
      material: "GOLD_NUGGET"
      buy-amount: 1
      refresh-after-click: true
      name: "&e%buy_amount% Ticket kaufen"
      lore:
        - "&7Preis: &f%buy_price%"
        - "&7Gekaufte Tickets: &f%tickets_total%"
        - "&7Topf: &f%pot%"
        - "&aKlicken zum Kaufen"
      actions:
        - "buy:%buy_amount%"
    pot-info:
      enabled: true
      slot: 13
      material: "CHEST"
      name: "&6Aktueller Topf"
      lore:
        - "&7Topf gesamt: &f%pot%"
        - "&7Ticket-Einsätze: &f%ticket_pot%"
        - "&7Zusatzbetrag: &f%base_pot%"
        - "&7Gekaufte Tickets: &f%tickets_total%"
        - "&7Teilnehmer: &f%players%/%min_players%"
        - "&7Nächste Ziehung: &f%next_draw%"
      actions: []
    player-head:
      enabled: true
      slot: 22
      material: "PLAYER_HEAD"
      skull-owner: "%player_name%"
      name: "&f%player_name%"
      lore:
        - "&7Deine Tickets: &f%tickets%"
        - "&7Deine Chance: &f%chance%"
        - "&7Gruppe: &f%lottery_group%"
        - "&7CMI Balance: &f%cmi_user_balance_formatted%"
        - "&7Jobs Level: &f%jobsr_user_totallevels%"
        - "&7Quest Fortschritt: &f%quests_player_current_quest_names%"
      actions: []
    free-ticket:
      enabled: false
      slot: 23
      material: "TRIPWIRE_HOOK"
      name: "&aKostenloses Ticket"
      lore:
        - "&7Wenn aktiviert, holst du hier"
        - "&7deine kostenlosen Tickets."
        - "&aKlicken zum Einlösen"
      actions:
        - "player:/lottery free"
    season-shop:
      enabled: false
      slot: 24
      material: "SUNFLOWER"
      name: "&eSaison-Shop"
      lore:
        - "&7Deine Punkte: &f%season_points%"
        - "&7Belohnungen im Chat ansehen."
        - "&aKlicken zum Öffnen"
      actions:
        - "player:/lottery shop"
    personal-statistics:
      enabled: true
      slot: 30
      material: "PLAYER_HEAD"
      skull-owner: "%player_name%"
      name: "&bDeine Statistik"
      lore:
        - "&7Tickets gesamt: &f%player_stats_tickets_bought%"
        - "&7Ausgaben: &f%player_stats_money_spent%"
        - "&7Gewinne: &f%player_stats_wins%"
        - "&aKlicken zum Öffnen"
      actions:
        - "open-personal-stats"
    statistics:
      enabled: true
      slot: 31
      material: "BOOK"
      name: "&6Statistik"
      lore:
        - "&7Top 10 Listen ansehen"
        - "&7für Tickets, Ausgaben,"
        - "&7Gewinne und Runden."
        - "&aKlicken zum Öffnen"
      actions:
        - "open-stats"
    language:
      enabled: true
      slot: 32
      material: "WRITABLE_BOOK"
      name: "&bSprache"
      lore:
        - "&7Aktuelle Sprache wechseln."
        - "&aKlicken zum Öffnen"
      actions:
        - "open-language"
    album:
      enabled: false
      slot: 36
      material: "BOOK"
      name: "&dTicket-Album"
      lore:
        - "&7Tickets, Glueckszahl,"
        - "&7Erfolge und Rang ansehen."
        - "&aKlicken zum Anzeigen"
      actions:
        - "open-album"
    claims:
      enabled: false
      slot: 37
      material: "ENDER_CHEST"
      name: "&aGewinn-Briefkasten"
      lore:
        - "&7Offene Zahlungen: &f%claim_payments%"
        - "&7Offene Nachrichten: &f%claim_notifications%"
        - "&aKlicken zum Anzeigen"
      actions:
        - "open-claims"
    lucky-number:
      enabled: false
      slot: 38
      material: "AMETHYST_SHARD"
      name: "&dGlueckszahl"
      lore:
        - "&7Aktuell: &f%lucky_number%"
        - "&7Setzen mit &e/lottery lucky <zahl>"
        - "&7Loeschen mit &e/lottery lucky clear"
      actions:
        - "message:&dNutze /lottery lucky <zahl>, um deine Glueckszahl zu setzen."
    watch-draw:
      enabled: false
      slot: 39
      material: "SPYGLASS"
      name: "&6Ziehung ansehen"
      lore:
        - "&7Schaltet das Animations-GUI"
        - "&7für die nächste Ziehung um."
        - "&aKlicken zum Umschalten"
      actions:
        - "watch-draw"
    profiles:
      enabled: false
      slot: 40
      material: "MAP"
      name: "&bJackpot-Stufen"
      lore:
        - "&7Waehle kleine, normale"
        - "&7oder Event-Lotterien."
        - "&aKlicken zum Oeffnen"
      actions:
        - "open-profile"
    admin:
      enabled: true
      slot: 34
      material: "COMMAND_BLOCK"
      name: "&cAdmin"
      lore:
        - "&7Admin-Übersicht öffnen."
        - "&aKlicken zum Öffnen"
      actions:
        - "open-admin"
    close:
      enabled: true
      slot: 35
      material: "BARRIER"
      name: "&cSchließen"
      lore:
        - "&7Klicke, um das Menü zu schließen."
      actions:
        - "close"

