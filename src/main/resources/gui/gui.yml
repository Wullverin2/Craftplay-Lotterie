language-gui:
  # DE: Aktiviert das Sprachmenü. EN: Enables the language menu.
  enabled: true
  # DE: Titel des Sprachmenüs. EN: Title of the language menu.
  title: "&6&lSprache"
  # DE: Größe des Sprachmenüs. EN: Size of the language menu.
  size: 27
  # DE: Füllmaterial im Sprachmenü. EN: Filler material in the language menu.
  filler-material: "LIGHT_BLUE_STAINED_GLASS_PANE"
  auto-detect:
    # DE: Erkennt alle Dateien aus lang/<sprache>.yml automatisch und zeigt sie als Sprachbuttons.
    # EN: Automatically detects all files from lang/<language>.yml and shows them as language buttons.
    enabled: true
    # DE: Slots für automatisch erkannte Sprachen, in dieser Reihenfolge.
    # EN: Slots for automatically detected languages, in this order.
    slots: [10, 11, 12, 13, 14, 15, 16]
    # DE: Material für automatisch erzeugte Sprachbuttons.
    # EN: Material for automatically generated language buttons.
    material: "LIME_DYE"
    # DE: Name des automatisch erzeugten Sprachbuttons.
    # EN: Name of the automatically generated language button.
    name: "&a%language_name%"
    # DE: Lore des automatisch erzeugten Sprachbuttons.
    # EN: Lore of the automatically generated language button.
    lore:
      - "&7Sprachcode: &f%language%"
      - "&7%selected%"
      - "&aKlicken zum Auswählen"
  # DE: Buttons zum Wechseln der Sprache. EN: Buttons for changing language.
  items:
    back:
      enabled: true
      slot: 22
      material: "ARROW"
      name: "&aZurück"
      lore:
        - "&7Zurück zur Lotterie."
      actions:
        - "open-main"

